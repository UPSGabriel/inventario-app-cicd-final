apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app
  labels:
    app: inventario-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: inventario-app

  template:
    metadata:
      labels:
        app: inventario-app
        version: v2

    spec:
      # La imagen distroless :nonroot ejecuta la app con UID/GID 65532.
      # fsGroup permite que el volumen emptyDir montado en /app/data sea escribible
      # sin dar privilegios de root al contenedor.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: inventario-app
          image: ghcr.io/upsgabriel/inventario-app-cicd-final:a07b96493f7dbe1042062875efafc9cf9371c3f1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: PORT
              value: "3000"

            - name: APP_VERSION
              value: "v2"

            - name: APP_COLOR
              value: "green"

            - name: SIMULATE_FAILURE
              value: "false"

            - name: STARTUP_DELAY_SECONDS
              value: "12"

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventario-secret
                  key: API_KEY

            - name: DB_PATH
              value: "/app/data/products.json"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: inventario-data
              mountPath: /app/data

      volumes:
        - name: inventario-data
          emptyDir: {}
